@if (loading) {
  <app-loading></app-loading>
} @else if (error) {
  <app-error [message]="error"></app-error>
} @else{
<app-header [titlePage]="titlePage" [kpis]="kpis"></app-header>
}
<div class="chart-container">
  <canvas id="DashboardPieChart">{{ pieChart }}</canvas>
  <canvas
    id="DashboardPieChart"
    role="img"
    aria-label="Graphique circulaire du nombre total de médailles par pays. Cliquez sur un pays pour afficher ses détails.">
    Graphique circulaire du nombre total de médailles par pays. Cliquez sur un pays pour afficher ses détails.
  </canvas>
</div>
